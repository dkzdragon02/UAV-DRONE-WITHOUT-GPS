vision_node:
  ros__parameters:
    use_visual_odometry: true
    use_orb_slam: false
    use_vins: false
    camera_width: 640
    camera_height: 480
    camera_fps: 30
    camera_calibration: "camera_calibration.yaml"
    frame_id: "vision_odom"
    child_frame_id: "base_link"
    feature_detector: "ORB"
    max_features: 500
    min_match_count: 12
    ransac_threshold: 3.0

optical_flow_node:
  ros__parameters:
    method: "lucas_kanade"
    max_corners: 150
    quality_level: 0.01
    min_distance: 10

